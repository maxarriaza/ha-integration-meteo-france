[project]
name = "ha-integration-meteo-france"
version = "0.0.0"
description = "Meteo France Home Assistant integration"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "homeassistant==2026.2.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.314",
]

[home-assistant]
domain = "meteo_france"
name = "Météo France"
config-flow = true
iot-class = "cloud_polling"
integration-type = "service"

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
